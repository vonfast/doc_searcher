name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            pkg-config \
            libfontconfig1-dev \
            zenity \
            libfuse2

      - name: Download appimagetool
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./build_appimage.sh

      - name: Release Linux
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: DoXgrep-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Universal App Bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build macOS Binaries
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Create Universal Binary & Package App
        run: |
          mkdir -p target/DoXgrep.app/Contents/MacOS
          mkdir -p target/DoXgrep.app/Contents/Resources

          # Combine ARM64 (Apple Silicon) and x86_64 (Intel) into Universal Binary
          lipo -create \
            target/aarch64-apple-darwin/release/doxgrep \
            target/x86_64-apple-darwin/release/doxgrep \
            -output target/DoXgrep.app/Contents/MacOS/doxgrep

          chmod +x target/DoXgrep.app/Contents/MacOS/doxgrep
          
          cat <<'EOF' > target/DoXgrep.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>doxgrep</string>
              <key>CFBundleIconFile</key>
              <string>doxgrep.png</string>
              <key>CFBundleIdentifier</key>
              <string>com.vonfast.doxgrep</string>
              <key>CFBundleName</key>
              <string>DoXgrep</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>0.2.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          if [ -f "assets/doxgrep.png" ]; then
            cp assets/doxgrep.png target/DoXgrep.app/Contents/Resources/doxgrep.png
          fi

          # Ad-hoc code signing required for macOS Apple Silicon
          codesign -s - --force --deep target/DoXgrep.app

          # Package Zip preserving Mac file attributes
          ditto -c -k --sequesterRsrc target/DoXgrep.app DoXgrep-macOS-Universal.zip

          # Create DMG image
          mkdir -p target/dmg_stage
          cp -R target/DoXgrep.app target/dmg_stage/
          ln -s /Applications target/dmg_stage/Applications
          hdiutil create -volname "DoXgrep" -srcfolder target/dmg_stage -ov -format UDZO DoXgrep-macOS-Universal.dmg
          rm -rf target/dmg_stage

      - name: Upload macOS Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            DoXgrep-macOS-Universal.zip
            DoXgrep-macOS-Universal.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
