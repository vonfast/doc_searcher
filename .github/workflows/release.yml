name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            pkg-config \
            libfontconfig1-dev \
            zenity \
            libfuse2

      - name: Download appimagetool
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./build_appimage.sh

      - name: Release Linux
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: DoXgrep-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS App Bundle
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build macOS Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package macOS App
        run: |
          mkdir -p target/DoXgrep.app/Contents/MacOS
          mkdir -p target/DoXgrep.app/Contents/Resources
          cp target/${{ matrix.target }}/release/doxgrep target/DoXgrep.app/Contents/MacOS/doxgrep
          chmod +x target/DoXgrep.app/Contents/MacOS/doxgrep
          
          cat <<'EOF' > target/DoXgrep.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>doxgrep</string>
              <key>CFBundleIconFile</key>
              <string>doxgrep.png</string>
              <key>CFBundleIdentifier</key>
              <string>com.vonfast.doxgrep</string>
              <key>CFBundleName</key>
              <string>DoXgrep</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>0.2.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          if [ -f "assets/doxgrep.png" ]; then
            cp assets/doxgrep.png target/DoXgrep.app/Contents/Resources/doxgrep.png
          fi

          cd target
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            ZIP_NAME="DoXgrep-macOS-AppleSilicon.zip"
          else
            ZIP_NAME="DoXgrep-macOS-Intel.zip"
          fi
          zip -r -q "../$ZIP_NAME" DoXgrep.app
          cd ..

      - name: Upload macOS Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            DoXgrep-macOS-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
