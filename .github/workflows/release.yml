name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create, for example v0.2.0"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            pkg-config \
            libfontconfig1-dev \
            zenity \
            libfuse2

      - name: Download appimagetool
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./build_appimage.sh

      - name: Release Linux
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || inputs.release_tag != ''
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          files: DoXsearch-x86_64.AppImage
          tag_name: ${{ inputs.release_tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          name: linux-appimage
          path: DoXsearch-x86_64.AppImage
          if-no-files-found: error

  build-macos:
    name: Build macOS Universal App Bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build macOS Binaries
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Create Universal Binary & Package App
        run: |
          mkdir -p target/DoXsearch.app/Contents/MacOS
          mkdir -p target/DoXsearch.app/Contents/Resources

          # Combine ARM64 (Apple Silicon) and x86_64 (Intel) into Universal Binary
          lipo -create \
            target/aarch64-apple-darwin/release/doxsearch \
            target/x86_64-apple-darwin/release/doxsearch \
            -output target/DoXsearch.app/Contents/MacOS/doxsearch

          chmod +x target/DoXsearch.app/Contents/MacOS/doxsearch
          
          cat <<'EOF' > target/DoXsearch.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>doxsearch</string>
              <key>CFBundleIconFile</key>
              <string>doxsearch.png</string>
              <key>CFBundleIdentifier</key>
              <string>com.vonfast.doxsearch</string>
              <key>CFBundleName</key>
              <string>DoXsearch</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>0.2.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          if [ -f "assets/doxgrep.png" ]; then
            cp assets/doxgrep.png target/DoXsearch.app/Contents/Resources/doxsearch.png
          fi

          # Ad-hoc code signing required for macOS Apple Silicon
          codesign -s - --force --deep target/DoXsearch.app

          # Package Zip preserving Mac file attributes
          ditto -c -k --sequesterRsrc target/DoXsearch.app DoXsearch-macOS-Universal.zip

          # Create DMG image
          mkdir -p target/dmg_stage
          cp -R target/DoXsearch.app target/dmg_stage/
          ln -s /Applications target/dmg_stage/Applications
          hdiutil create -volname "DoXsearch" -srcfolder target/dmg_stage -ov -format UDZO DoXsearch-macOS-Universal.dmg
          rm -rf target/dmg_stage

      - name: Upload macOS Release Asset
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || inputs.release_tag != ''
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          files: |
          name: macos-binaries
          path: |
            DoXsearch-macOS-Universal.zip
            DoXsearch-macOS-Universal.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.release_tag != ''
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          tag_name: ${{ inputs.release_tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
