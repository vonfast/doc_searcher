[package]
name = "doxsearch"
version = "0.2.0"
edition = "2021"
authors = ["Petri <vonfast@gmail.com>"]
description = "A simple desktop tool for searching text in PDF, DOCX, ODT, and text files."
repository = "https://github.com/vonfast/doc_searcher"
license = "MIT"

[[bin]]
name = "doxsearch"
path = "src/main.rs"

[dependencies]
# GUI-kirjasto
eframe = { version = "0.27", features = ["default"] }
egui = "0.27"

# ZIP-tiedostojen käsittely (docx ja odt ovat zip-arkistoja)
zip = "0.6"
# PDF-tekstin purku
pdf-extract = "0.7"
# XML-parsinta
quick-xml = "0.31"
# Rinnakkainen hakemistoläpikäynti
jwalk = "0.8"
# Tiedostovalitsin XDG Desktop Portal -tuella (D-Bus / ashpd)
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# Virheenkäsittely
anyhow = "1"
# Tiedostojen avaaminen
open = "5.3"
# Säikeistys tulosten lähettämiseen
crossbeam-channel = "0.5"
# Rinnakkaislaskenta
rayon = "1.10"
# Säännölliset lausekkeet ja nopea haku
regex = "1.10"
# Päivämäärän muotoilu
chrono = "0.4"
# Flate/Zlib purku vioittuneiden PDF-virtojen toipumiseen
flate2 = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = true
[package.metadata.appimage]
assets = ["assets/"]
auto_link = true
auto_link_exclude_list = ["libc.so*", "libpthread.so*"]

[package.metadata.bundle]
name = "DoXsearch"
identifier = "com.vonfast.doxsearch"
icon = ["assets/doxsearch.png"]
version = "0.2.0"
copyright = "Copyright © 2026 Petri"
category = "Utility"
short_description = "A simple desktop tool for searching text in PDF, DOCX, ODT, and text files."

