[package]
name = "doxgrep"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "doxgrep"
path = "src/main.rs"

[dependencies]
# GUI-kirjasto
eframe = { version = "0.27", features = ["default"] }
egui = "0.27"

# ZIP-tiedostojen käsittely (docx ja odt ovat zip-arkistoja)
zip = "0.6"
# PDF-tekstin purku
pdf-extract = "0.7"
# XML-parsinta
quick-xml = "0.31"
# Rekursiivinen hakemistoläpikäynti
walkdir = "2"
# Virheenkäsittely
anyhow = "1"
# Säikeistys tulosten lähettämiseen
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.appimage]
assets = ["assets/"]
auto_link = true
auto_link_exclude_list = ["libc.so*", "libpthread.so*"]
